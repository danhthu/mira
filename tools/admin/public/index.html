<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira Blog — Content Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
    #header-stats { font-size: 0.85rem; color: #aaa; }

    main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }

    .post-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid #e8e8e8;
      transition: box-shadow 0.15s;
    }
    .post-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .post-card.approved { border-left: 3px solid #22c55e; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .card-num {
      font-size: 0.75rem;
      color: #999;
      font-variant-numeric: tabular-nums;
      min-width: 2rem;
      padding-top: 2px;
    }
    .card-meta { flex: 1; }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.2rem;
    }
    .card-desc {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.5;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pending { background: #fef9c3; color: #a16207; }
    .badge-approved { background: #dcfce7; color: #166534; }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .img-section, .approve-section { display: flex; flex-direction: column; gap: 0.5rem; }

    label { font-size: 0.75rem; font-weight: 600; color: #555; letter-spacing: 0.02em; }

    textarea, input[type="text"], input[type="date"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      font-size: 0.8rem;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafafa;
      resize: vertical;
      transition: border-color 0.15s;
    }
    textarea:focus, input:focus {
      outline: none;
      border-color: #6366f1;
      background: #fff;
    }
    textarea { min-height: 64px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-gen { background: #6366f1; color: #fff; }
    .btn-gen:hover:not(:disabled) { background: #4f46e5; }
    .btn-approve { background: #22c55e; color: #fff; }
    .btn-approve:hover:not(:disabled) { background: #16a34a; }
    .btn-unapprove { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-unapprove:hover:not(:disabled) { background: #e5e7eb; }

    .btn-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    .img-preview {
      border-radius: 6px;
      overflow: hidden;
      background: #f5f5f0;
      border: 1px solid #e8e8e8;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-preview img { width: 100%; display: block; border-radius: 6px; }
    .img-preview .placeholder {
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
      padding: 1rem;
    }

    .status-msg {
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.2rem;
    }
    .status-msg.ok { color: #16a34a; }
    .status-msg.err { color: #dc2626; }

    .approved-info {
      font-size: 0.75rem;
      color: #166534;
      background: #dcfce7;
      padding: 0.35rem 0.65rem;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #999;
    }

    @media (max-width: 600px) {
      .card-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Mira Blog — Content Review</h1>
  <span id="header-stats">Đang tải...</span>
</header>

<main id="posts-container">
  <p style="color:#999;font-size:.85rem">Đang tải danh sách bài...</p>
</main>

<footer id="footer-stats"></footer>

<script>
let postsData = [];

async function loadPosts() {
  const res = await fetch('/api/posts');
  postsData = await res.json();
  render();
}

function render() {
  const approved = postsData.filter(p => p.approved).length;
  const total = postsData.length;
  document.getElementById('header-stats').textContent = `${approved} / ${total} đã approve`;
  document.getElementById('footer-stats').textContent = `${approved} / ${total} bài đã approve`;

  const container = document.getElementById('posts-container');
  container.innerHTML = '';

  postsData.forEach((post, i) => {
    const card = document.createElement('div');
    card.className = 'post-card' + (post.approved ? ' approved' : '');
    card.id = `card-${post.slug}`;

    const badgeClass = post.approved ? 'badge-approved' : 'badge-pending';
    const badgeText = post.approved ? '✅ Approved' : '🟡 Pending';

    const approvedInfo = post.approved
      ? `<div class="approved-info">📅 ${post.scheduledDate || 'Ngày chưa đặt'} · Approved ${new Date(post.approvedAt).toLocaleDateString('vi-VN')}</div>`
      : '';

    card.innerHTML = `
      <div class="card-header">
        <span class="card-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="card-meta">
          <div class="card-title">${post.title}</div>
          <div class="card-desc">${post.description}</div>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>

      ${approvedInfo}

      <div class="card-body">
        <div class="img-section">
          <label>PROMPT ẢNH</label>
          <textarea id="prompt-${post.slug}">${post.image_prompt || post.title}</textarea>
          <div class="btn-row">
            <button class="btn btn-gen" onclick="generateImage('${post.slug}')">🎨 Tạo ảnh</button>
            <span class="status-msg" id="img-status-${post.slug}"></span>
          </div>
          <div class="img-preview" id="preview-${post.slug}">
            ${post.hasImage
              ? `<img src="/images-proxy/${post.slug}" alt="preview" onerror="this.parentElement.innerHTML='<span class=placeholder>Ảnh chưa tải được</span>'">`
              : `<span class="placeholder">Chưa có ảnh</span>`}
          </div>
        </div>

        <div class="approve-section">
          <label>NGÀY ĐĂNG</label>
          <input type="date" id="date-${post.slug}" value="${post.scheduledDate || ''}">
          <div class="btn-row">
            <button class="btn btn-approve" onclick="approve('${post.slug}')" ${post.approved ? 'style="display:none"' : ''}>✅ Approve</button>
            <button class="btn btn-unapprove" onclick="unapprove('${post.slug}')" ${!post.approved ? 'style="display:none"' : ''}>↩ Unapprove</button>
          </div>
          <span class="status-msg" id="approve-status-${post.slug}"></span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

async function generateImage(slug) {
  const prompt = document.getElementById(`prompt-${slug}`).value.trim();
  if (!prompt) return;

  const btn = document.querySelector(`#card-${slug} .btn-gen`);
  const statusEl = document.getElementById(`img-status-${slug}`);
  const previewEl = document.getElementById(`preview-${slug}`);

  btn.disabled = true;
  btn.textContent = '⏳ Đang tạo...';
  statusEl.textContent = '';
  statusEl.className = 'status-msg';

  try {
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, prompt }),
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error);

    previewEl.innerHTML = `<img src="${data.dataUrl}" alt="generated">`;
    statusEl.textContent = '✓ Đã tạo xong';
    statusEl.className = 'status-msg ok';

    const post = postsData.find(p => p.slug === slug);
    if (post) post.imagePath = data.imagePath;

  } catch (err) {
    statusEl.textContent = '✗ ' + err.message;
    statusEl.className = 'status-msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = '🎨 Tạo ảnh';
  }
}

async function approve(slug) {
  const scheduledDate = document.getElementById(`date-${slug}`).value;
  const post = postsData.find(p => p.slug === slug);
  const statusEl = document.getElementById(`approve-status-${slug}`);

  try {
    const res = await fetch('/api/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, scheduledDate, imagePath: post?.imagePath }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    if (post) {
      post.approved = true;
      post.scheduledDate = scheduledDate;
      post.approvedAt = data.entry.approvedAt;
    }
    render();
  } catch (err) {
    statusEl.textContent = '✗ ' + err.message;
    statusEl.className = 'status-msg err';
  }
}

async function unapprove(slug) {
  const statusEl = document.getElementById(`approve-status-${slug}`);

  try {
    const res = await fetch('/api/unapprove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const post = postsData.find(p => p.slug === slug);
    if (post) { post.approved = false; post.scheduledDate = null; post.approvedAt = null; }
    render();
  } catch (err) {
    statusEl.textContent = '✗ ' + err.message;
    statusEl.className = 'status-msg err';
  }
}

loadPosts();
</script>
</body>
</html>
