# PROJECT.yaml — tạo bởi skill du-an-dieu-phoi, G0, 2026-08-25
# Nguồn suy ra: package.json (code/fe, code/be), cây thư mục thật trên đĩa,
# docs/00-vision.md → docs/08-three-pillars.md, code/CLAUDE.md, HANDOFF.md từng feature.

du_an:
  ma: mira
  ten: Mira
  khach_hang: noi-bo
  loai: monorepo               # mobile (code/fe) + backend (code/be), không có web frontend riêng
  co_nghiem_thu_hinh_thuc: false   # dự án cá nhân, không hợp đồng/biên bản — suy từ ngữ cảnh, chưa hỏi trực tiếp
  han_giao:                    # chưa có deadline cứng

ky_thuat:
  backend:
    khung: khong-co             # raw Node.js + pg, không dùng framework HTTP (Express/Fastify/NestJS) — chưa có route/server nào
    ngon_ngu: TypeScript
    lenh_build: "npm run build"      # = tsc, xác nhận từ code/be/package.json
    lenh_test: "npm test"            # = vitest run (thêm 2026-08-25 cùng tầng repository)
    thu_muc: code/be
  mobile:
    khung: "React Native + Expo 51 / RN 0.74 / React 18"   # 2026-08-27: code/fe bị thay bằng Batify verbatim, xem ghi_chu_quyet_dinh — KHÔNG còn SDK 54/Zustand/SQLite như trước
    lenh_build: "npm run web:build"  # expo export --platform web + patch-pwa.mjs — CHƯA có build native (Expo dùng EAS, chưa cấu hình)
    lenh_test: "npm test"            # = jest — HIỆN KHÔNG CHẠY ĐƯỢC, config trùng lặp + setupFiles trỏ sai tên file, xem code/CLAUDE.md "Nợ kỹ thuật"
    thu_muc: code/fe
  csdl:
    he: PostgreSQL
    phien_ban:                       # chưa xác nhận version cụ thể
    mo_rong: []
    co_du_lieu_khong_gian: false
  ha_tang:
    container: khong-co
    dieu_phoi: khong-co
    ci: khong-co                     # không thấy .github/workflows hay CI config nào

quy_uoc:
  thu_muc_shared:
    fe: code/fe/src/shared
    be: code/be/src/shared
  sql_tap_trung_tai: code/be/src/database/queries
  ngon_ngu_giao_dien: [vi]
  gioi_han_dong_moi_lan_sua: 100

nguon_yeu_cau:
  - duong_dan: docs/00-vision.md
    loai: quyet-dinh
    hang_tham_quyen: 1
  - duong_dan: docs/01-modules.md
    loai: quyet-dinh
    hang_tham_quyen: 1
  - duong_dan: docs/02-data-model.md
    loai: quyet-dinh
    hang_tham_quyen: 1
  - duong_dan: docs/03-formulas.md
    loai: quyet-dinh
    hang_tham_quyen: 1
  - duong_dan: docs/04-roadmap.md
    loai: quyet-dinh
    hang_tham_quyen: 1
  - duong_dan: docs/05-v1-spec.md
    loai: quyet-dinh
    hang_tham_quyen: 1    # cao nhất cho phạm vi V1 — mọi tài liệu khác thua file này khi mâu thuẫn về scope

bao_mat:
  muc: co-ban                        # mặc định cho dự án cá nhân giai đoạn V1, chưa hỏi lại — xác nhận trước G5

nhan_dien:
  co_bo_nhan_dien: false             # app chưa có brand token riêng (growth/brand/ mới có placeholder, dùng cho blog không phải app)
  duong_dan:

van_hanh:
  moi_truong: [local]
  cam_tu_dong:
    - commit
    - push
    - cham-csdl-that
    - nap-du-lieu-mau-len-that
    - xoa-du-lieu
    - gui-cho-khach

# --- Quyết định đã chốt với người dùng ngày 2026-08-25 (không phải trường chuẩn của schema, ghi lại để không hỏi lại) ---
ghi_chu_quyet_dinh:
  - "code/fe/src/core/{lifeRate,freedomCapital,expenseConversion}.ts thuộc phạm vi V2 (tài chính), V1 spec ghi rõ 'không tài chính' — GIỮ NGUYÊN, không xóa, không phát triển thêm trong vòng lặp V1."
  - "code/be (Postgres backend, hạ tầng sync) ngoài phạm vi V1 ('chưa làm sync ở V1' theo CLAUDE.md gốc) — người dùng chọn VẪN TIẾP TỤC xây song song, không chặn lại."
  - "docs/00-vision.md → 08-three-pillars.md coi là đặc tả đã chốt (tương đương đầu ra phan-tich-yeu-cau) — nhưng người dùng vẫn muốn chạy đủ G1–G3 để sinh bộ docs/dac-ta/* + PLAN.md chuẩn theo khuôn skill, chấp nhận có thể trùng lặp một phần với docs/00-08."
  - "2026-08-27: code/fe (kiến trúc features/shared/core/SQLite, 12 module, 177 test) bị THAY HOÀN TOÀN bằng app Batify gốc verbatim (commit d633408, nhánh feat/port-batify-modules) bởi một phiên làm việc khác cùng ngày. Người dùng xác nhận: Batify là khung xuất phát tạm, dọn dần cho khớp 6 'Ràng buộc cứng' — KHÔNG quay lại kiến trúc cũ. Danh sách nợ kỹ thuật cụ thể (streak/point-level/màu đỏ vi phạm ràng buộc #3, Sentry vi phạm #5, jest config hỏng, 141 lỗi tsc) ghi ở code/CLAUDE.md mục 'Nợ kỹ thuật cần dọn trước khi ship V1'. G2–G4 dưới đây reset về trạng thái phản ánh code Batify, không phải kiến trúc cũ đã mất."

