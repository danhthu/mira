  <text x="56" y="116" font-size="19" fill="#6B6257">Thu gom hạnh phúc bằng hạt đường, ghi khó khăn bằng hạt muối. Cùng một hũ.</text>
  <text x="56" y="150" font-size="15" fill="#8A8075">Đặt lên M5 Khoảnh khắc đã có trong V1 · docs/05-v1-spec.md màn 1 và 3 · docs/01-modules.md “hũ hạnh phúc”</text>
  <text x="56" y="182" font-size="15" fill="#16908A">Không đếm điểm · không chuỗi ngày · không hũ nào “đúng” · muối không tô đỏ</text>

